sonar.organization=max-ldc
sonar.projectKey=Max-ldc_Collector.shop
sonar.host.url=https://sonarcloud.io

# Source code exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.tsx,**/*.test.ts

# Coverage exclusions (bootstrap/config files not unit-testable)
sonar.coverage.exclusions=**/main.ts,**/*.module.ts

# Modules
sonar.modules=apps/backend,apps/frontend

# Backend
apps/backend.sonar.projectName=Backend
apps/backend.sonar.sources=src
apps/backend.sonar.tests=test
apps/backend.sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Frontend
apps/frontend.sonar.projectName=Frontend
apps/frontend.sonar.sources=src
apps/frontend.sonar.tests=src
apps/frontend.sonar.test.inclusions=**/*.test.tsx,**/*.test.ts
apps/frontend.sonar.typescript.lcov.reportPaths=coverage/lcov.info
