version: '3.8'

services:
  api-service:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=collector
      - DATABASE_PASSWORD=collector
      - DATABASE_NAME=collector_db
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      - database
      - keycloak
    networks:
      - collector-network

  web-app:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - collector-network

  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=collector
      - POSTGRES_PASSWORD=collector
      - POSTGRES_DB=collector_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - collector-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://database:5432/keycloak
      - KC_DB_USERNAME=collector
      - KC_DB_PASSWORD=collector
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - collector-network

networks:
  collector-network:
    driver: bridge

volumes:
  postgres-data:
