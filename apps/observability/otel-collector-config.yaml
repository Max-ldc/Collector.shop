receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'collector-backend'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:3000'] 

processors:
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889" # Local debugging

  # Configuration for Azure Monitor Managed Prometheus
  prometheusremotewrite:
    endpoint: "https://<YOUR_AMW_ENDPOINT>/api/v1/push"
    auth:
      authenticator: azure_auth

extensions:
  # Authenticates using the System Assigned Managed Identity of the Container App
  azure_auth:
    authentication:
      type: "managed_identity"

service:
  extensions: [azure_auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite] 

