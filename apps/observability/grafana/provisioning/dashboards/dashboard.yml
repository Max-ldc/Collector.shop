apiVersion: 1

providers:
  - name: 'Collector Dashboard'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Chemin dans lequel nous allons copier le fichier JSON
      # Nous separons la config (provisioning) des dashboards eux-memes
      path: /var/lib/grafana/dashboards
