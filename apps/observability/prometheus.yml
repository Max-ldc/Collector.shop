global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'collector-backend'
    scheme: https
    # IMPORTANT : targets doit etre "host:port", pas "https://...". Le scheme est defini au dessus.
    static_configs:
      - targets: ['collector-backend.wittyforest-1d08efa7.francecentral.azurecontainerapps.io:443']
    tls_config:
      insecure_skip_verify: true
