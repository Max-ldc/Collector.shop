name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions nécessaires pour dorny/paths-filter
permissions:
  contents: read
  pull-requests: read

env:
  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
  DATABASE_USER: ${{ secrets.DATABASE_USER }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
  KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
  KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
  KEYCLOAK_SECRET: ${{ secrets.KEYCLOAK_SECRET }}
  KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
  KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
  KC_DB: ${{ secrets.KC_DB }}
  KC_DB_URL: ${{ secrets.KC_DB_URL }}
  KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
  KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}

jobs:
  # Job to check file changes for conditional execution
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            observability:
              - 'apps/observability/**'

  audit:
    name: Audit Dependencies
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Audit Backend
        continue-on-error: true
        run: |
          cd apps/backend
          npm install --ignore-scripts
          npm audit --audit-level=critical

      - name: Audit Frontend
        continue-on-error: true
        run: |
          cd apps/frontend
          npm install --ignore-scripts
          npm audit --audit-level=critical

  build-test:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Cache lock files from both apps
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Install & Test Backend
        run: |
          cd apps/backend
          npm install
          npm run lint
          npm run test:cov
          npm run build

      - name: Install & Test Frontend
        run: |
          cd apps/frontend
          npm install
          npm run lint
          npm run test:cov
          npm run build
      
      # Upload coverage for SonarCloud
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar-scan:
    name: SonarQube Scan
    runs-on: self-hosted
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx sonarqube-scanner "-Dsonar.token=$SONAR_TOKEN"

  # ==============================================================================
  # DÉPLOIEMENT CONTINUE (CD) - OBSERVABILITY
  # ==============================================================================
  build-push-observability:
    name: Build & Push Observability
    # Run only if observability files changed or if manually triggered (always run on main push if changed)
    needs: [check-changes]
    # Execute if observability changed AND (it's main branch OR it's a PR)
    if: needs.check-changes.outputs.observability == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    
    env:
      ACR_NAME: acrcollector2659
      IMAGE_TAG: latest

    steps:
      - uses: actions/checkout@v4

      # Connexion au Registre (UNIQUEMENT SUR MAIN)
      - name: Login to ACR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build & Push Prometheus
      - name: Build Prometheus
        run: |
          FULL_IMAGE_NAME="${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:${{ env.IMAGE_TAG }}"
          
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker build -t $FULL_IMAGE_NAME -f apps/observability/Dockerfile.prometheus apps/observability/
            docker push $FULL_IMAGE_NAME
          else
            docker build -f apps/observability/Dockerfile.prometheus apps/observability/
          fi

      # Build & Push Grafana
      - name: Build Grafana
        run: |
          FULL_IMAGE_NAME="${{ env.ACR_NAME }}.azurecr.io/grafana-custom:${{ env.IMAGE_TAG }}"
          
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker build -t $FULL_IMAGE_NAME -f apps/observability/Dockerfile.grafana apps/observability/
            docker push $FULL_IMAGE_NAME
          else
            docker build -f apps/observability/Dockerfile.grafana apps/observability/
          fi

  # ==============================================================================
  # DÉPLOIEMENT CONTINUE (CD) - PUSH TO REGISTRY ONLY
  # ==============================================================================
  build-and-push:
    name: Build & Push Images
    # On exécute si c'est 'main' (pour déployer) OU si c'est une PR (pour vérifier le build)
    # L'étape de "Login" et "Push" sera conditionnée plus bas.
    needs: [build-test, sonar-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    env:
      ACR_NAME: acrcollector2659
      # On utilise 'latest' pour simplifier le déclenchement automatique côté Azure
      IMAGE_TAG: latest
      
      BACKEND_APP_NAME: collector-backend
      FRONTEND_APP_NAME: collector-frontend
      
      # URLs de Prod
      VITE_API_URL: https://collector-backend.wittyforest-1d08efa7.francecentral.azurecontainerapps.io/api
      VITE_KEYCLOAK_URL: https://collector-auth.wittyforest-1d08efa7.francecentral.azurecontainerapps.io
      VITE_KEYCLOAK_REALM: collector-realm
      VITE_KEYCLOAK_CLIENT_ID: collector-frontend

    steps:
      - uses: actions/checkout@v4

      # 1. Connexion au Registre (UNIQUEMENT SUR MAIN)
      - name: Login to ACR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 2. Build Backend (Et Push si Main)
      - name: Build Backend
        run: |
          FULL_IMAGE_NAME="${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_APP_NAME }}:${{ env.IMAGE_TAG }}"
          
          # Si Main, on tag et on push. Sinon on build juste.
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker build -t $FULL_IMAGE_NAME ./apps/backend
            docker push $FULL_IMAGE_NAME
          else
            docker build ./apps/backend
          fi

      # 3. Build Frontend (Et Push si Main)
      - name: Build Frontend
        run: |
          FULL_IMAGE_NAME="${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_APP_NAME }}:${{ env.IMAGE_TAG }}"
          
          # Si Main, on tag et on push. Sinon on build juste.
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker build \
              --build-arg VITE_API_URL=${{ env.VITE_API_URL }} \
              --build-arg VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }} \
              --build-arg VITE_KEYCLOAK_REALM=${{ env.VITE_KEYCLOAK_REALM }} \
              --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ env.VITE_KEYCLOAK_CLIENT_ID }} \
              -t $FULL_IMAGE_NAME ./apps/frontend
            
            docker push $FULL_IMAGE_NAME
          else
            # Build simple pour validation
            docker build \
              --build-arg VITE_API_URL=check \
              --build-arg VITE_KEYCLOAK_URL=check \
              --build-arg VITE_KEYCLOAK_REALM=check \
              --build-arg VITE_KEYCLOAK_CLIENT_ID=check \
              ./apps/frontend
          fi
