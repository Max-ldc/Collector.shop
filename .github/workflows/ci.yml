name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
  DATABASE_USER: ${{ secrets.DATABASE_USER }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
  KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
  KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
  KEYCLOAK_SECRET: ${{ secrets.KEYCLOAK_SECRET }}
  KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
  KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
  KC_DB: ${{ secrets.KC_DB }}
  KC_DB_URL: ${{ secrets.KC_DB_URL }}
  KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
  KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}

jobs:
  audit:
    name: Audit Dependencies
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Audit Backend
        run: |
          cd apps/backend
          npm install --ignore-scripts
          npm audit --audit-level=critical || true

      - name: Audit Frontend
        run: |
          cd apps/frontend
          npm install --ignore-scripts
          npm audit --audit-level=critical || true

  build-test:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Cache lock files from both apps
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Install & Test Backend
        run: |
          cd apps/backend
          npm ci
          npm run lint
          npm run test:cov
          npm run build

      - name: Install & Test Frontend
        run: |
          cd apps/frontend
          npm ci
          npm run lint
          npm run test:cov
          npm run build
      
      # Upload coverage for SonarCloud
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar-scan:
    name: SonarQube Scan
    runs-on: self-hosted
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx sonarqube-scanner "-Dsonar.token=$SONAR_TOKEN"

  docker-build:
    name: Docker Build Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: docker build -t collector-backend ./apps/backend

      - name: Build Frontend Image
        run: docker build -t collector-frontend ./apps/frontend
